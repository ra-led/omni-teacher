version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: "npm run dev"
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_WS_BASE_URL: wss://chat-proto.ru
      NEXT_PUBLIC_INVESTOR_DECK_URL: /investors-static
    depends_on:
      - backend
      - investors-web

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg2://omni:omni@postgres:5432/omni
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: omni
      MINIO_SECRET_KEY: omni_secret
      OMNI_MODEL: gpt-4o
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: "celery -A app.worker.celery_app worker --loglevel=INFO"
    environment:
      DATABASE_URL: postgresql+psycopg2://omni:omni@postgres:5432/omni
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: omni
      MINIO_SECRET_KEY: omni_secret
      OMNI_MODEL: gpt-4o
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - backend
      - redis

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: omni
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2024-02-26T09-33-48Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: omni
      MINIO_ROOT_PASSWORD: omni_secret
    volumes:
      - minio-data:/data

  studio:
    build:
      context: ./studio
      dockerfile: Dockerfile
    command: "npm run dev"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

  investors-web:
    image: python:3.12-alpine
    command: sh -c "python -m http.server 8081 -d /site"
    volumes:
      - ./omni-teacher-web:/site:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
